services:
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.6.8
    restart: unless-stopped
    user: "0:0"
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki_data:
  promtail_positions:
