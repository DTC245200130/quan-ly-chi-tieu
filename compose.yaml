services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://expense:${POSTGRES_PASSWORD}@db:5432/expense
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://tauri.localhost,https://tauri.localhost}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Expense Management AI <onboarding@resend.dev>}
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
