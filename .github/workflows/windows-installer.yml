name: Windows installer

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API URL ending in /api
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Rust stable
        run: rustup update stable
      - run: npm ci
      - name: Build installers
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: so-chi-tieu-windows
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
