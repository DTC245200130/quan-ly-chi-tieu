<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1328px;height:1759px;background:#FFFFFF;" width="1328.125px" height="1759.375px" viewBox="0 0 1328 1759" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="252.881" y="103.537" fill="#000" font-size="43.75" textLength="816.873" font-weight="700" font-family="Arial">BIỂU ĐỒ HOẠT ĐỘNG — ask_assistant</text></g><ellipse cx="658.192" cy="194.058" rx="31.25" ry="31.25" fill="#222" style="stroke:#222;stroke-width:3.125;"/><rect x="62.726" y="287.808" width="1190.933" height="224.205" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="93.976" y="363.026" fill="#000" font-size="46.875" textLength="364.838" font-family="Arial">Điều kiện bắt đầu</text><text x="93.976" y="416.928" fill="#000" font-size="46.875" textLength="1128.433" font-family="Arial">Đã đăng nhập; câu hỏi không rỗng; conversation đúng</text><text x="93.976" y="470.83" fill="#000" font-size="46.875" textLength="499.924" font-family="Arial">quyền nếu được truyền.</text><rect x="302.834" y="574.513" width="710.716" height="116.402" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="334.084" y="649.731" fill="#000" font-size="46.875" textLength="648.216" font-family="Arial">Kiểm tra/khởi tạo conversation.</text><rect x="379.636" y="753.415" width="557.114" height="116.402" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="410.886" y="828.633" fill="#000" font-size="46.875" textLength="494.614" font-family="Arial">Tạo evidence tổng hợp.</text><rect x="388.86" y="932.317" width="538.666" height="116.402" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="420.11" y="10