="583.595" height="116.402" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="389.588" y="1132.535" fill="#000" font-size="46.875" textLength="521.095" font-family="Arial">Trả token; sai thì trả 401.</text><rect x="50" y="1236.218" width="1200.272" height="224.205" fill="#F4FBF8" style="stroke:#299D78;stroke-width:1.563;" rx="39.063" ry="39.063"/><text x="81.25" y="1311.436" fill="#000" font-size="46.875" textLength="161.591" font-family="Arial">Kết quả</text><text x="81.25" y="1365.338" fill="#000" font-size="46.875" textLength="1137.772" font-family="Arial">Đúng - token hợp lệ được trả. Sai - không tạo phiên và</text><text x="81.25" y="1419.24" fill="#000" font-size="46.875" textLength="349.205" font-family="Arial">trả thông báo lỗi.</text><ellipse cx="650.136" cy="1557.298" rx="34.375" ry="34.375" fill="none" style="stroke:#222;stroke-width:3.125;"/><ellipse cx="650.136" cy="1557.298" rx="18.75" ry="18.75" fill="#222" style="stroke:#222;stroke-width:3.125;"/><line x1="650.136" y1="225.308" x2="650.136" y2="287.808" style="stroke:#345B52;stroke-width:3.125;"/><polygon points="637.636,256.558,650.136,287.808,662.636,256.558,650.136,269.058" fill="#345B52" style="stroke:#345B52;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="650.136" y1="458.112" x2="650.136" y2="520.612" style="stroke:#345B52;stroke-width:3.125;"/><polygon points="637.636,489.362,650.136,520.612,662.636,489.362,650.136,501.862" fill="#345B52" style="stroke:#345B52;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="650.136" y1="637.013" x2="650.136" y2="699.513" style="stroke:#345B52;stroke-width:3.125;"/><polygon points="637.636,668.263,650.136,699.513,662.636,668.263,650.136,680.763" fill="#345B52" style="stroke:#345B52;stroke-width:3.125;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="650.136" y1="815.915" x2="650.136" y2="878.415" style="stroke:#345B52;stroke-width:3.125;"/><polygon points="637.6